<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hayknz — Naija Matters</title>
  <meta name="description" content="hayknz — official visuals, videos and photos. Naija matters." />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Instagram link previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="hayknz — Naija Matters" />
  <meta property="og:description" content="Official visuals, videos and photos from hayknz." />
  <meta property="og:image" content="naija.png" />
  <meta property="og:url" content="https://REPLACE-WITH-YOUR-DOMAIN.com/" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="hayknz — Naija Matters" />
  <meta name="twitter:description" content="Official visuals, videos and photos from hayknz." />
  <meta name="twitter:image" content="naija.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>hayknz muzik <br> Thi(e)s(e) Naija matter(s)</h1>

  <div class="images-container">
    <img src="f4n.png" alt="hayknz in suit and beanie, four-panel style shot" />
    <p class="image-description">Naija on hayknz' mind</p>
  </div>

  <!-- Fixed: naija.png and f4n2.png now stack, each full width, instead of
       sitting side-by-side in a flex row -->
  <div class="images-container">
    <img src="naija.png" alt="Naija graphic with Nigerian flag" />
  </div>

  <div class="images-container">
    <img src="f4n2.png" alt="hayknz silhouette shots in suit" />
  </div>

  <div class="images-container">
    <img src="whit.png" alt="hayknz photo" />
  </div>

  <!-- Track wall: this grid renders however many tracks are in tracks-data.js.
       Add a track = add one entry to tracks.json, then run build.py.
       Nothing here needs editing by hand. -->
  <section class="gallery-grid" id="gallery" aria-label="Track gallery"></section>
  <p class="gallery-status" id="gallery-status">No tracks yet.</p>

  <script src="tracks-data.js"></script>
  <script>
    (function () {
      var grid = document.getElementById('gallery');
      var status = document.getElementById('gallery-status');

      if (typeof TRACKS === 'undefined' || !TRACKS.length) {
        return; // "No tracks yet." message stays visible
      }
      status.remove();

      TRACKS.forEach(function (t) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = 'track-' + t.id + '.html';

        var thumb = document.createElement('div');
        thumb.className = 'card-thumb';
        thumb.style.background = t.color || '#0f6e56';
        thumb.textContent = t.title;

        var title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = t.title;

        a.appendChild(thumb);
        a.appendChild(title);
        grid.appendChild(a);
      });
    })();
  </script>

</body>
</html>
